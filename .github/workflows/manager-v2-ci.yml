name: Manager v2 CI

on:
  push:
    paths:
      - "manager-v2/**"
      - ".github/workflows/manager-v2-ci.yml"
  pull_request:
    paths:
      - "manager-v2/**"
      - ".github/workflows/manager-v2-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manager-v2/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
